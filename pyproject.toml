[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-velocity"
version = "1.0.0"
description = "Recover a continuous rocket velocity profile from three discrete samples by fitting a quadratic interpolant and solving the Vandermonde system with Gauss–Jordan elimination (partial pivoting)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = [
  "python",
  "numpy",
  "matplotlib",
  "numerical-methods",
  "linear-algebra",
  "gauss-jordan",
  "polynomial-interpolation",
  "scientific-computing",
  "curve-fitting",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
rocket-velocity = "rocket_velocity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
