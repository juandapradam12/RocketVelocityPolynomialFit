[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-velocity"
version = "1.0.0"
description = "Quadratic polynomial fitting of rocket velocity samples via Gauss–Jordan elimination."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = ["numerical-methods", "polynomial-fitting", "gauss-jordan", "scientific-computing"]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
rocket-velocity = "rocket_velocity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
